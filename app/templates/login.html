<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <title>Вход superadmin</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; }
    .container { max-width: 420px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d8dde7; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #2459f2; color: white; font-weight: 700; cursor: pointer; }
    .error { color: #b72323; background: #fde9e9; border: 1px solid #f2caca; padding: 10px; border-radius: 8px; margin-top: 12px; }
    .hint { color: #666; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Вход superadmin</h1>
    <form method="post" action="/sa/login">
      <label for="username">Логин</label>
      <input id="username" name="username" required />

      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" required />

      <label for="totp_code">2FA код</label>
      <input id="totp_code" name="totp_code" placeholder="123456 или fallback-код" required />

      <button type="submit">Войти</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <div class="hint">Отдельный вход только для супер-админа. Для пользователей используйте /app.</div>
  </div>
</body>
</html>
